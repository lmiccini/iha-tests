- name: 20 Check all compute nodes are running before test
  hosts: hypervisor
  remote_user: zuul
  become: true
  gather_facts: false

  tasks:
    - name: 20 List all VMs
      community.libvirt.virt:
        command: list_vms
      register: vms_all

    - name: 20 Filter all VMs containing "compute" in the name
      ansible.builtin.set_fact:
        vms: "{{ vms_all.list_vms | select('search', 'compute') | list }}"

    - name: 20 List running VMs
      community.libvirt.virt:
        command: list_vms
        state: running
      register: running_vms_all

    - name: 20 Filter running VMs containing "compute" in the name
      ansible.builtin.set_fact:
        running_vms: "{{ running_vms_all.list_vms | select('search', 'compute') | list }}"

    - name: 20 Get list of not running VMs
      ansible.builtin.set_fact:
        not_running_vms: "{{ vms | difference(running_vms) }}"

    - name: 20 Start VMs that are not running
      community.libvirt.virt:
        name: "{{ item }}"
        state: running
      loop: "{{ not_running_vms }}"

    - name: 20 Fail if there are still VMs not running
      community.libvirt.virt:
        command: list_vms
        state: running
      register: updated_running_vms

    - name: 20 Check all compute VMs are running
      ansible.builtin.fail:
        msg: "Some compute VMs are still not running"
      when: (vms | difference(updated_running_vms.list_vms | select('search', 'compute') | list)) | length > 0

- name: 20 Test evacuation retry loop with SMART_EVACUATION
  hosts: controller-0
  remote_user: zuul
  gather_facts: false

  vars:
    name: "20-test-evacuation-retry"

  pre_tasks:
    - name: 20 Load and set compute details from JSON file as a fact
      ansible.builtin.set_fact:
        compute_details: "{{ (lookup('file', '/tmp/compute_details.json') | from_json) }}"

    - name: 20 Set dynamic compute node names using parsed compute details
      ansible.builtin.set_fact:
        compute_names: "{{ compute_details | map(attribute='hostname') | list }}"

  tasks:
    - name: 20 Create results file (failure)
      ansible.builtin.template:
        src: templates/iha-tests-results.xml.j2
        dest: /home/zuul/iha-tests-results/{{ name }}.xml
      vars:
        success: false

    - name: 20 Ensure all compute services are up and enabled before setup
      ansible.builtin.shell: |
        openstack --os-cloud default compute service set --enable --up {{ item }} nova-compute
      loop: "{{ compute_names }}"
      changed_when: false
      ignore_errors: true

    - name: 20 Wait for all compute services to be up
      openstack.cloud.compute_service_info:
        cloud: default
        binary: nova-compute
      register: all_services
      until: all_services.compute_services | rejectattr('state', 'equalto', 'up') | list | length == 0
      retries: 24
      delay: 5

    - name: 20 Enable smart evacuation
      ansible.builtin.template:
        src: templates/iha-cm.yaml.j2
        dest: /home/zuul/iha-cm.yaml
      vars:
        smart_evacuation: "true"

    - name: 20 Apply config
      ansible.builtin.shell: |
        oc -n openstack apply -f /home/zuul/iha-cm.yaml
      changed_when: false

    - name: 20 Wait for instanceha deployment to be available
      ansible.builtin.shell: |
        oc wait deployment/instanceha-0 -n openstack --for condition=Available --timeout=300s
      changed_when: false

    - name: 20 Wait for config to take effect
      ansible.builtin.shell: |
        oc -n openstack logs deploy/instanceha-0 --tail=20 | grep -q "Poll cycle completed"
      retries: 12
      delay: 5
      changed_when: false

    - name: 20 Delete all existing instances
      openstack.cloud.server_info:
        cloud: default
      register: existing_instances

    - name: 20 Remove existing instances
      openstack.cloud.server:
        cloud: default
        state: absent
        name: "{{ item.name }}"
      async: 600
      poll: 0
      loop: "{{ existing_instances.servers }}"
      when: existing_instances.servers | length > 0
      register: deletion_tasks

    - name: 20 Wait for all deletions to complete
      ansible.builtin.async_status:
        jid: "{{ item.ansible_job_id }}"
      loop: "{{ deletion_tasks.results }}"
      register: deletion_results
      until: deletion_results.finished
      retries: 20
      delay: 15
      when: existing_instances.servers | length > 0

    - name: 20 Query allocatable memory from placement
      ansible.builtin.shell: |
        compute1_hostname="{{ compute_details | selectattr('readable_hostname', 'equalto', 'compute-1') | map(attribute='hostname') | first }}"
        rp_uuid=$(openstack --os-cloud default resource provider list -f value -c uuid -c name | grep "$compute1_hostname" | awk '{print $1}')
        openstack --os-cloud default resource provider inventory list $rp_uuid -f json | \
          python3 -c "import sys,json; inv=json.load(sys.stdin); mem=[r for r in inv if r['resource_class']=='MEMORY_MB'][0]; print(int(mem['total'] * mem['allocation_ratio']) - mem['reserved'])"
      register: allocatable_result
      changed_when: false

    - name: 20 Compute dynamic fill flavor size
      ansible.builtin.set_fact:
        fill_mb: "{{ allocatable_result.stdout | int - 64 }}"

    - name: 20 Create fill flavor
      openstack.cloud.compute_flavor:
        cloud: default
        state: present
        name: fill
        ram: "{{ fill_mb }}"
        vcpus: 8
        disk: 1
        extra_specs:
          hw_rng:allowed: "True"

    - name: 20 Wait for compute-0 resource provider to be available in placement
      ansible.builtin.shell: |
        compute0_hostname="{{ compute_details | selectattr('readable_hostname', 'equalto', 'compute-0') | map(attribute='hostname') | first }}"
        rp_uuid=$(openstack --os-cloud default resource provider list -f value -c uuid -c name | grep "$compute0_hostname" | awk '{print $1}')
        traits=$(openstack --os-cloud default resource provider trait list $rp_uuid -f value)
        echo "$traits" | grep -q "COMPUTE_IMAGE_TYPE_QCOW2" && ! echo "$traits" | grep -q "COMPUTE_STATUS_DISABLED"
      register: trait_check
      until: trait_check.rc == 0
      retries: 12
      delay: 5
      changed_when: false

    - name: 20 Fill up each hypervisor except compute-0 with fill VMs
      openstack.cloud.server:
        cloud: default
        auth:
          project_name: admin
        state: present
        availability_zone: nova:{{ item_vm.0.hostname }}
        name: "{{ item_vm.0.readable_hostname }}-vmfill{{ item_vm.1 | string }}"
        image: cirros-0.6.2-iha-x86_64-disk.img
        timeout: 200
        flavor: fill
        auto_ip: false
        security_groups:
          - ping
        nics:
          - net-name: ihanet
        wait: true
      loop: "{{ compute_details | selectattr('readable_hostname', 'ne', 'compute-0') | product(range(1, (num_vms | default(1) | int) + 1) | list) }}"
      loop_control:
        loop_var: item_vm
      async: 6000
      poll: 0
      register: vm_creation_tasks

    - name: 20 Wait for all fill VMs to be created
      ansible.builtin.async_status:
        jid: "{{ item.ansible_job_id }}"
      register: vm_creation_result
      until: vm_creation_result.finished
      retries: 10
      delay: 5
      loop: "{{ vm_creation_tasks.results }}"
      loop_control:
        pause: 1

    - name: 20 Create vm-retry1 on compute-0 using iha.nano
      openstack.cloud.server:
        cloud: default
        auth:
          project_name: admin
        state: present
        availability_zone: nova:{{ compute_details | selectattr('readable_hostname', 'equalto', 'compute-0') | map(attribute='hostname') | first }}
        name: vm-retry1
        image: cirros-0.6.2-iha-x86_64-disk.img
        timeout: 200
        flavor: iha.nano
        security_groups:
          - ping
        nics:
          - net-name: ihanet

    - name: 20 Create vm-retry2 on compute-0 using iha.nano
      openstack.cloud.server:
        cloud: default
        auth:
          project_name: admin
        state: present
        availability_zone: nova:{{ compute_details | selectattr('readable_hostname', 'equalto', 'compute-0') | map(attribute='hostname') | first }}
        name: vm-retry2
        image: cirros-0.6.2-iha-x86_64-disk.img
        timeout: 200
        flavor: iha.nano
        security_groups:
          - ping
        nics:
          - net-name: ihanet

- name: 20 Crash compute-0
  hosts: hypervisor
  remote_user: zuul
  become: true
  gather_facts: false

  pre_tasks:
    - name: 20 Load and set compute details from JSON file as a fact
      ansible.builtin.set_fact:
        compute_details: "{{ (lookup('file', '/tmp/compute_details.json') | from_json) }}"

  tasks:
    - name: 20 Format compute-0 VM name for libvirt
      ansible.builtin.set_fact:
        compute_zero_vm_name: cifmw-{{ compute_details | selectattr('readable_hostname', 'equalto', 'compute-0') | map(attribute='hostname') | map('regex_replace',
          '\.ctlplane\.example\.com$', '') | first }}

    - name: 20 Destroy the compute-0 VM on libvirt
      community.libvirt.virt:
        name: "{{ compute_zero_vm_name }}"
        state: destroyed

- name: 20 Verify evacuation retry loop
  hosts: controller-0
  remote_user: zuul
  gather_facts: false

  pre_tasks:
    - name: 20 Load and set compute details from JSON file as a fact
      ansible.builtin.set_fact:
        compute_details: "{{ (lookup('file', '/tmp/compute_details.json') | from_json) }}"

    - name: 20 Set compute_zero_hostname fact for compute-0
      ansible.builtin.set_fact:
        compute_zero_hostname: "{{ compute_details | selectattr('readable_hostname', 'equalto', 'compute-0') | map(attribute='hostname') | first }}"

  tasks:
    - name: 20 Wait for compute-0 to transition to down
      openstack.cloud.compute_service_info:
        cloud: default
      register: hypervisor_list
      until: (hypervisor_list.compute_services | selectattr('host', 'equalto', compute_zero_hostname) | map(attribute='state') | first) == 'down'
      retries: 12
      delay: 5

    - name: 20 List pods in the openstack namespace
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: openstack
      register: pod_list

    - name: 20 Filter for instanceha pod
      ansible.builtin.set_fact:
        instanceha_pod_name: "{{ pod_list.resources | map(attribute='metadata.name') | select('search', 'instanceha') | list | first | default('', true) }}"

    - name: 20 Wait for retry loop to execute and exhaust retries
      kubernetes.core.k8s_log:
        namespace: openstack
        name: "{{ instanceha_pod_name }}"
        tail_lines: 300
        all_containers: true
      register: instanceha_logs
      retries: 60
      delay: 5
      until: "'Giving up' in instanceha_logs.log or 'Failed evacuating' in instanceha_logs.log"

    - name: 20 Verify retry attempts were logged
      kubernetes.core.k8s_log:
        namespace: openstack
        name: "{{ instanceha_pod_name }}"
        tail_lines: 300
        all_containers: true
      register: retry_logs

    - name: 20 Assert re-issue messages appear in logs
      ansible.builtin.assert:
        that:
          - "'Re-issuing evacuation' in retry_logs.log or 'Re-issued evacuation' in retry_logs.log"
        fail_msg: "No evacuation retry messages found in logs — retry loop did not execute"

    - name: 20 Assert max retries exhausted message appears
      ansible.builtin.assert:
        that:
          - "'Giving up' in retry_logs.log"
        fail_msg: "No 'Giving up' message found — retries did not exhaust"

    - name: 20 Verify vm-retry1 is in ERROR state (evacuation failed)
      openstack.cloud.server_info:
        cloud: default
        name: vm-retry1
      register: vm1_info

    - name: 20 Assert vm-retry1 is in ERROR state on compute-0
      ansible.builtin.assert:
        that:
          - vm1_info.servers[0].status == "ERROR"
          - vm1_info.servers[0].hypervisor_hostname == compute_zero_hostname
        fail_msg: "vm-retry1 should be in ERROR state on compute-0 (status={{ vm1_info.servers[0].status }}, host={{ vm1_info.servers[0].hypervisor_hostname }})"

    - name: 20 Verify vm-retry2 is in ERROR state (both VMs attempted)
      openstack.cloud.server_info:
        cloud: default
        name: vm-retry2
      register: vm2_info

    - name: 20 Assert vm-retry2 is in ERROR state on compute-0
      ansible.builtin.assert:
        that:
          - vm2_info.servers[0].status == "ERROR"
          - vm2_info.servers[0].hypervisor_hostname == compute_zero_hostname
        fail_msg: "vm-retry2 should be in ERROR state on compute-0 — instanceha must attempt all VMs even when evacuations fail (status={{ vm2_info.servers[0].status }}, host={{ vm2_info.servers[0].hypervisor_hostname }})"

    - name: 20 Save logs to results
      ansible.builtin.shell: oc -n openstack logs deploy/instanceha-0 > /home/zuul/iha-tests-results/{{ name }}.log
      changed_when: false

- name: 20 Restart compute-0
  hosts: hypervisor
  remote_user: zuul
  become: true
  gather_facts: false

  pre_tasks:
    - name: 20 Load and set compute details from JSON file as a fact
      ansible.builtin.set_fact:
        compute_details: "{{ (lookup('file', '/tmp/compute_details.json') | from_json) }}"

  tasks:
    - name: 20 Format compute-0 VM name for libvirt
      ansible.builtin.set_fact:
        compute_zero_vm_name: cifmw-{{ compute_details | selectattr('readable_hostname', 'equalto', 'compute-0') | map(attribute='hostname') | map('regex_replace',
          '\.ctlplane\.example\.com$', '') | first }}

    - name: 20 Restart the compute-0 VM on libvirt
      community.libvirt.virt:
        name: "{{ compute_zero_vm_name }}"
        state: running

- name: 20 Cleanup
  hosts: controller-0
  remote_user: zuul
  gather_facts: false

  vars:
    name: "20-test-evacuation-retry"

  pre_tasks:
    - name: 20 Load and set compute details from JSON file as a fact
      ansible.builtin.set_fact:
        compute_details: "{{ (lookup('file', '/tmp/compute_details.json') | from_json) }}"

    - name: 20 Set compute_zero_hostname fact for compute-0
      ansible.builtin.set_fact:
        compute_zero_hostname: "{{ compute_details | selectattr('readable_hostname', 'equalto', 'compute-0') | map(attribute='hostname') | first }}"

    - name: 20 Retrieve all VM names
      openstack.cloud.server_info:
        cloud: default
      register: all_vms_info

    - name: 20 Filter VMs to remove (vm-retry and vmfill)
      ansible.builtin.set_fact:
        vms_to_remove: "{{ all_vms_info.servers | selectattr('name', 'search', '^vm-retry|vmfill') | map(attribute='name') | list }}"

  tasks:
    - name: 20 Remove all test VMs
      openstack.cloud.server:
        cloud: default
        state: absent
        name: "{{ item }}"
      loop: "{{ vms_to_remove }}"
      async: 600
      poll: 0
      ignore_errors: true
      register: deletion_tasks

    - name: 20 Wait for all VM deletions to complete
      ansible.builtin.async_status:
        jid: "{{ item.ansible_job_id }}"
      loop: "{{ deletion_tasks.results }}"
      register: deletion_results
      until: deletion_results.finished
      retries: 20
      delay: 15

    - name: 20 Delete fill flavor
      openstack.cloud.compute_flavor:
        cloud: default
        state: absent
        name: fill

    - name: 20 Enable compute-0 and unset forced_down
      ansible.builtin.shell: |
        openstack --os-cloud default compute service set --enable --up {{ compute_zero_hostname }} nova-compute
      changed_when: false

    - name: 20 Wait compute-0 to be up
      openstack.cloud.compute_service_info:
        cloud: default
        binary: nova-compute
        host: "{{ compute_zero_hostname }}"
      register: compute_0_status
      until: "'up' in compute_0_status.compute_services | map(attribute='state')"
      retries: 24
      delay: 5

    - name: 20 Wait compute-0 to be enabled
      openstack.cloud.compute_service_info:
        cloud: default
        binary: nova-compute
        host: "{{ compute_zero_hostname }}"
      register: compute_0_status
      until: "'enabled' in compute_0_status.compute_services | map(attribute='status')"
      retries: 60
      delay: 5

    - name: 20 Reset iha configmap
      ansible.builtin.template:
        src: templates/iha-cm.yaml.j2
        dest: /home/zuul/iha-cm.yaml

    - name: 20 Apply default config
      ansible.builtin.shell: |
        oc -n openstack apply -f /home/zuul/iha-cm.yaml
      changed_when: false

    - name: 20 Wait for instanceha deployment to be available
      ansible.builtin.shell: |
        oc wait deployment/instanceha-0 -n openstack --for condition=Available --timeout=300s
      changed_when: false

    - name: 20 save logs
      ansible.builtin.shell: oc logs deploy/instanceha-0 >> /home/zuul/iha-tests-results/{{ name }}.log
      changed_when: false

    - name: 20 Create results file (success)
      ansible.builtin.template:
        src: templates/iha-tests-results.xml.j2
        dest: /home/zuul/iha-tests-results/{{ name }}.xml
      vars:
        success: true
