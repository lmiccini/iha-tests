# Test InstanceHA authentication using Application Credentials instead of clouds.yaml
# This test verifies that:
# 1. An OpenStack Application Credential can be created for the admin user
# 2. A K8s Secret with AC_ID and AC_SECRET can be created and mounted
# 3. InstanceHA authenticates successfully using v3applicationcredential
# 4. Evacuation works correctly with AC-based authentication

- name: 24 Pre-cleanup (idempotent re-run)
  hosts: controller-0
  remote_user: zuul
  gather_facts: false
  tasks:
    - name: 24 Pre-cleanup - Remove leftover VM
      openstack.cloud.server:
        cloud: default
        auth:
          project_name: admin
        state: absent
        name: vm-ac-test
      ignore_errors: true

    - name: 24 Pre-cleanup - Remove leftover K8s secret
      ansible.builtin.shell: |
        oc -n openstack delete secret instanceha-ac-secret 2>/dev/null || true
      changed_when: false
      ignore_errors: true

    - name: 24 Pre-cleanup - Remove leftover application credential
      ansible.builtin.shell: |
        openstack --os-cloud default application credential delete instanceha-ac 2>/dev/null || true
      changed_when: false
      ignore_errors: true

- name: 24 Test Application Credential Authentication
  hosts: controller-0
  remote_user: zuul
  gather_facts: false

  vars:
    name: "24-test-application-credentials"

  tasks:
    - name: 24 Create results file (failure)
      ansible.builtin.template:
        src: templates/iha-tests-results.xml.j2
        dest: /home/zuul/iha-tests-results/{{ name }}.xml
      vars:
        success: false

    - name: 24 Fetch random string
      ansible.builtin.shell:
        cmd: cat ~/.ssh/config |grep 'Host compute' |awk '{print $2}' |head -1|cut -d- -f2
      register: string
      changed_when: false

    - name: 24 Set string as fact
      ansible.builtin.set_fact:
        string: "{{ string.stdout }}"

    - name: 24 Set compute-0 name as fact
      ansible.builtin.set_fact:
        compute0: "compute-{{ string }}-0.ctlplane.example.com"

    - name: 24 Set compute-1 name as fact
      ansible.builtin.set_fact:
        compute1: "compute-{{ string }}-1.ctlplane.example.com"

    - name: 24 Set compute-2 name as fact
      ansible.builtin.set_fact:
        compute2: "compute-{{ string }}-2.ctlplane.example.com"

    - name: 24 Set compute-3 name as fact
      ansible.builtin.set_fact:
        compute3: "compute-{{ string }}-3.ctlplane.example.com"

    - name: 24 Set compute-4 name as fact
      ansible.builtin.set_fact:
        compute4: "compute-{{ string }}-4.ctlplane.example.com"

    #############################################################################
    # SETUP: Create Application Credential and K8s Secret
    #############################################################################

    - name: 24 Delete any existing test application credential
      ansible.builtin.shell: |
        openstack --os-cloud default application credential delete instanceha-ac 2>/dev/null || true
      changed_when: false

    - name: 24 Create Application Credential for admin user
      ansible.builtin.shell: |
        openstack --os-cloud default application credential create instanceha-ac \
          --unrestricted \
          -f json
      register: ac_result
      changed_when: false

    - name: 24 Parse Application Credential output
      ansible.builtin.set_fact:
        ac_data: "{{ ac_result.stdout | from_json }}"

    - name: 24 Extract AC_ID and AC_SECRET
      ansible.builtin.set_fact:
        ac_id: "{{ ac_data.id }}"
        ac_secret: "{{ ac_data.secret }}"

    - name: 24 Verify AC was created
      ansible.builtin.assert:
        that:
          - ac_id | length > 0
          - ac_secret | length > 0
        fail_msg: "Failed to create application credential"
        success_msg: "Application credential created with ID: {{ ac_id }}"

    - name: 24 Delete any existing K8s AC secret
      ansible.builtin.shell: |
        oc -n openstack delete secret instanceha-ac-secret 2>/dev/null || true
      changed_when: false

    - name: 24 Create K8s Secret with AC_ID and AC_SECRET
      ansible.builtin.shell: |
        oc -n openstack create secret generic instanceha-ac-secret \
          --from-literal=AC_ID="{{ ac_id }}" \
          --from-literal=AC_SECRET="{{ ac_secret }}"
      changed_when: false

    - name: 24 Verify K8s secret was created
      ansible.builtin.shell: |
        oc -n openstack get secret instanceha-ac-secret -o jsonpath='{.data.AC_ID}' | base64 -d
      register: secret_check
      changed_when: false

    - name: 24 Assert secret content matches
      ansible.builtin.assert:
        that:
          - secret_check.stdout == ac_id
        fail_msg: "K8s secret AC_ID does not match the created application credential"
        success_msg: "K8s secret contains correct AC_ID"

    #############################################################################
    # UPDATE InstanceHA CR to use Application Credentials
    #############################################################################

    - name: 24 Render InstanceHA CR with applicationCredentialSecret
      ansible.builtin.template:
        src: templates/iha.yaml.j2
        dest: /home/zuul/iha-ac.yaml
      vars:
        applicationCredentialSecret: instanceha-ac-secret

    - name: 24 Apply InstanceHA CR with AC auth
      ansible.builtin.shell: |
        oc -n openstack apply -f /home/zuul/iha-ac.yaml
      changed_when: false

    - name: 24 Wait for InstanceHA deployment to be available
      ansible.builtin.shell: |
        oc wait deployment/instanceha-0 -n openstack --for condition=Available --timeout=300s
      changed_when: false

    - name: 24 Wait for InstanceHA pod to restart with new secret
      ansible.builtin.pause:
        seconds: 30

    - name: 24 Verify AC secret is mounted in the pod
      ansible.builtin.shell: |
        oc -n openstack exec deploy/instanceha-0 -- ls /secrets/ac-credentials/AC_ID /secrets/ac-credentials/AC_SECRET
      register: mount_check
      changed_when: false
      retries: 24
      delay: 5
      until: mount_check.rc == 0

    - name: 24 Verify InstanceHA logs show AC authentication
      ansible.builtin.shell: |
        oc -n openstack logs deploy/instanceha-0 | grep -i "v3applicationcredential" || echo "NOT_FOUND"
      register: ac_log_check
      changed_when: false
      retries: 24
      delay: 5
      until: "'NOT_FOUND' not in ac_log_check.stdout"

    - name: 24 Assert AC auth log entry exists
      ansible.builtin.assert:
        that:
          - "'NOT_FOUND' not in ac_log_check.stdout"
        fail_msg: "InstanceHA should log application credential authentication"
        success_msg: "InstanceHA correctly using application credential authentication"

    #############################################################################
    # TEST: Evacuation works with AC authentication
    #############################################################################

    - name: 24 Wait for compute-0 resource provider to be available in placement
      ansible.builtin.shell: |
        rp_uuid=$(openstack --os-cloud default resource provider list -f value -c uuid -c name | grep "{{ hostvars['controller-0']['compute0'] }}" | awk '{print $1}')
        traits=$(openstack --os-cloud default resource provider trait list $rp_uuid -f value)
        echo "$traits" | grep -q "COMPUTE_IMAGE_TYPE_QCOW2" && ! echo "$traits" | grep -q "COMPUTE_STATUS_DISABLED"
      register: trait_check
      until: trait_check.rc == 0
      retries: 24
      delay: 5
      changed_when: false

    - name: 24 Create test instance on compute-0
      openstack.cloud.server:
        cloud: default
        auth:
          project_name: admin
        state: present
        availability_zone: "nova:{{ hostvars['controller-0']['compute0'] }}"
        name: vm-ac-test
        image: cirros-0.6.2-iha-x86_64-disk.img
        timeout: 300
        flavor: iha.nano
        security_groups:
          - ping
        nics:
          - net-name: ihanet

    - name: 24 Wait for vm-ac-test to be active
      ansible.builtin.shell: |
        openstack --os-cloud default server show vm-ac-test -f value -c status
      register: vm_status
      changed_when: false
      retries: 30
      delay: 5
      until: vm_status.stdout == "ACTIVE"

- name: 24 Crash compute-0
  hosts: hypervisor
  remote_user: zuul
  become: true
  gather_facts: false

  tasks:
    - name: 24 Shutdown compute-0
      community.libvirt.virt:
        name: "cifmw-compute-{{ hostvars['controller-0']['string'] }}-0"
        state: destroyed

- name: 24 Verify evacuation with AC auth
  hosts: controller-0
  remote_user: zuul
  gather_facts: false

  vars:
    name: "24-test-application-credentials"

  tasks:
    - name: 24 Wait for vm-ac-test to be evacuated
      ansible.builtin.shell: |
        openstack --os-cloud default server show vm-ac-test |grep 'OS-EXT-SRV-ATTR:host ' |awk '{print $4}'
      register: vm_host
      changed_when: false
      retries: 60
      delay: 5
      until: vm_host.stdout != hostvars['controller-0']['compute0']

    - name: 24 Verify vm-ac-test was evacuated from compute-0
      ansible.builtin.assert:
        that:
          - vm_host.stdout != hostvars['controller-0']['compute0']
        fail_msg: "vm-ac-test was NOT evacuated from compute-0 using AC authentication"
        success_msg: "vm-ac-test was correctly evacuated (AC auth works). Now on: {{ vm_host.stdout }}"

    - name: 24 Verify vm-ac-test is active after evacuation
      ansible.builtin.shell: |
        openstack --os-cloud default server show vm-ac-test -f value -c status
      register: vm_status_post
      changed_when: false

    - name: 24 Assert vm is active
      ansible.builtin.assert:
        that:
          - vm_status_post.stdout == "ACTIVE"
        fail_msg: "vm-ac-test should be ACTIVE after evacuation but is: {{ vm_status_post.stdout }}"
        success_msg: "vm-ac-test is ACTIVE after evacuation with AC auth"

    - name: 24 Verify IHA logs show successful evacuation with AC
      ansible.builtin.shell: |
        oc -n openstack logs deploy/instanceha-0 | grep -i "Evacuation successful" | tail -5
      register: evac_logs
      changed_when: false

    - name: 24 Assert evacuation was logged
      ansible.builtin.assert:
        that:
          - "'Evacuation successful' in evac_logs.stdout"
        fail_msg: "No evacuation log entries found — AC authentication may have failed silently"
        success_msg: "Evacuation with AC authentication succeeded and was logged"

    #############################################################################
    # CLEANUP
    #############################################################################

    - name: 24 Delete test VM
      openstack.cloud.server:
        cloud: default
        auth:
          project_name: admin
        state: absent
        name: vm-ac-test

    - name: 24 Restore InstanceHA CR without AC (back to password auth)
      ansible.builtin.template:
        src: templates/iha.yaml.j2
        dest: /home/zuul/iha.yaml

    - name: 24 Apply default InstanceHA CR
      ansible.builtin.shell: |
        oc -n openstack apply -f /home/zuul/iha.yaml
      changed_when: false

    - name: 24 Wait for InstanceHA deployment to be available
      ansible.builtin.shell: |
        oc wait deployment/instanceha-0 -n openstack --for condition=Available --timeout=300s
      changed_when: false

    - name: 24 Delete K8s AC secret
      ansible.builtin.shell: |
        oc -n openstack delete secret instanceha-ac-secret 2>/dev/null || true
      changed_when: false

    - name: 24 Delete OpenStack application credential
      ansible.builtin.shell: |
        openstack --os-cloud default application credential delete instanceha-ac 2>/dev/null || true
      changed_when: false

- name: 24 Cleanup - Restart compute-0
  hosts: hypervisor
  remote_user: zuul
  become: true
  gather_facts: false

  tasks:
    - name: 24 Start compute-0
      community.libvirt.virt:
        name: "cifmw-compute-{{ hostvars['controller-0']['string'] }}-0"
        state: running

- name: 24 Cleanup - Wait for computes
  hosts: controller-0
  remote_user: zuul
  gather_facts: false

  vars:
    name: "24-test-application-credentials"

  tasks:
    - name: 24 Wait compute-0 to be up
      openstack.cloud.compute_service_info:
        cloud: default
        binary: "nova-compute"
        host: "{{ compute0 }}"
      register: compute_0_status
      until: "'up' in compute_0_status.compute_services | map(attribute='state')"
      retries: 60
      delay: 5

    - name: 24 Wait compute-0 to be enabled
      openstack.cloud.compute_service_info:
        cloud: default
        binary: "nova-compute"
        host: "{{ compute0 }}"
      register: compute_0_status
      until: "'enabled' in compute_0_status.compute_services | map(attribute='status')"
      retries: 60
      delay: 5

    - name: 24 save logs
      ansible.builtin.shell: oc logs deploy/instanceha-0 >> /home/zuul/iha-tests-results/{{ name }}.log
      changed_when: false

    - name: 24 Create results file (success)
      ansible.builtin.template:
        src: templates/iha-tests-results.xml.j2
        dest: /home/zuul/iha-tests-results/{{ name }}.xml
      vars:
        success: true
