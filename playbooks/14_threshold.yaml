- name: 14 Test threshold mass failure protection
  hosts: controller-0
  remote_user: zuul
  gather_facts: false

  vars:
    name: "14-test-threshold"

  pre_tasks:
    - name: 14 Create results file (failure)
      ansible.builtin.template:
        src: templates/iha-tests-results.xml.j2
        dest: /home/zuul/iha-tests-results/{{ name }}.xml
      vars:
        success: false

    - name: 14 Load and set compute details from JSON file as a fact
      ansible.builtin.set_fact:
        compute_details: "{{ (lookup('file', '/tmp/compute_details.json') | from_json) }}"

    - name: 14 Set dynamic compute node names using parsed compute details
      ansible.builtin.set_fact:
        compute_names: "{{ compute_details | map(attribute='hostname') | list }}"

  tasks:
    - name: 14 Set threshold to 10 percent (any single failure exceeds it)
      ansible.builtin.template:
        src: templates/iha-cm.yaml.j2
        dest: /home/zuul/iha-cm.yaml
      vars:
        threshold: "10"
        smart_evacuation: "true"

    - name: 14 Apply threshold config
      ansible.builtin.shell: |
        oc -n openstack apply -f /home/zuul/iha-cm.yaml
      changed_when: false

    - name: 14 Wait for instanceha deployment to be available
      ansible.builtin.shell: |
        oc wait deployment/instanceha-0 -n openstack --for condition=Available --timeout=300s
      changed_when: false

    - name: 14 Wait for config to take effect
      ansible.builtin.shell: |
        oc -n openstack logs deploy/instanceha-0 --tail=20 | grep -q "Poll cycle completed"
      retries: 24
      delay: 5
      changed_when: false

    - name: 14 Wait for compute-0 resource provider to be available in placement
      ansible.builtin.shell: |
        compute0_hostname="{{ compute_details | selectattr('readable_hostname', 'equalto', 'compute-0') | map(attribute='hostname') | first }}"
        rp_uuid=$(openstack --os-cloud default resource provider list -f value -c uuid -c name | grep "$compute0_hostname" | awk '{print $1}')
        traits=$(openstack --os-cloud default resource provider trait list $rp_uuid -f value)
        echo "$traits" | grep -q "COMPUTE_IMAGE_TYPE_QCOW2" && ! echo "$traits" | grep -q "COMPUTE_STATUS_DISABLED"
      register: trait_check
      until: trait_check.rc == 0
      retries: 24
      delay: 5
      changed_when: false

    - name: 14 Create instance on compute-0
      openstack.cloud.server:
        cloud: default
        auth:
          project_name: admin
        state: present
        availability_zone: nova:{{ compute_details | selectattr('readable_hostname', 'equalto', 'compute-0') | map(attribute='hostname') | first }}
        name: c1-threshold
        image: cirros-0.6.2-iha-x86_64-disk.img
        timeout: 200
        flavor: iha.nano
        security_groups:
          - ping
        nics:
          - net-name: ihanet

- name: 14 Crash compute-0
  hosts: hypervisor
  remote_user: zuul
  become: true
  gather_facts: false

  pre_tasks:
    - name: 14 Load and set compute details from JSON file as a fact
      ansible.builtin.set_fact:
        compute_details: "{{ (lookup('file', '/tmp/compute_details.json') | from_json) }}"

  tasks:
    - name: 14 Format compute-0 VM name for libvirt
      ansible.builtin.set_fact:
        compute_zero_vm_name: cifmw-{{ compute_details | selectattr('readable_hostname', 'equalto', 'compute-0') | map(attribute='hostname') | map('regex_replace',
          '\.ctlplane\.example\.com$', '') | first }}

    - name: 14 Destroy the compute-0 VM on libvirt
      community.libvirt.virt:
        name: "{{ compute_zero_vm_name }}"
        state: destroyed

- name: 14 Verify threshold blocks evacuation
  hosts: controller-0
  remote_user: zuul
  gather_facts: false

  pre_tasks:
    - name: 14 Load and set compute details from JSON file as a fact
      ansible.builtin.set_fact:
        compute_details: "{{ (lookup('file', '/tmp/compute_details.json') | from_json) }}"

    - name: 14 Set compute_zero_hostname fact for compute-0
      ansible.builtin.set_fact:
        compute_zero_hostname: "{{ compute_details | selectattr('readable_hostname', 'equalto', 'compute-0') | map(attribute='hostname') | first }}"

  tasks:
    - name: 14 Wait for compute-0 to transition to down
      openstack.cloud.compute_service_info:
        cloud: default
      register: hypervisor_list
      until: (hypervisor_list.compute_services | selectattr('host', 'equalto', compute_zero_hostname) | map(attribute='state') | first) == 'down'
      retries: 24
      delay: 5

    - name: 14 List pods in the openstack namespace
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: openstack
      register: pod_list

    - name: 14 Filter for instanceha pod
      ansible.builtin.set_fact:
        instanceha_pod_name: "{{ pod_list.resources | map(attribute='metadata.name') | select('search', 'instanceha') | list | first | default('', true) }}"

    - name: 14 Retrieve logs and check for threshold exceeded message
      kubernetes.core.k8s_log:
        namespace: openstack
        name: "{{ instanceha_pod_name }}"
        tail_lines: 200
        all_containers: true
      register: instanceha_logs
      retries: 30
      delay: 5
      until: "'exceeds threshold' in instanceha_logs.log and 'Not evacuating' in instanceha_logs.log"

    - name: 14 Verify VM was NOT evacuated (still on compute-0)
      openstack.cloud.server_info:
        cloud: default
        name: c1-threshold
      register: vm_info

    - name: 14 Fail if VM was evacuated
      ansible.builtin.fail:
        msg: "VM c1-threshold was evacuated despite threshold being exceeded"
      when: vm_info.servers[0].hypervisor_hostname != compute_zero_hostname

    - name: 14 Check for ThresholdExceeded K8s event
      ansible.builtin.shell: |
        oc get events -n openstack --field-selector reason=ThresholdExceeded --no-headers 2>/dev/null | grep -c 'ThresholdExceeded' || echo 0
      register: threshold_events
      changed_when: false
      retries: 24
      delay: 5
      until: threshold_events.stdout | int > 0

    - name: 14 Verify ThresholdExceeded event was emitted
      ansible.builtin.debug:
        msg: "Found {{ threshold_events.stdout }} ThresholdExceeded events"

- name: 14 Restart compute-0
  hosts: hypervisor
  remote_user: zuul
  become: true
  gather_facts: false

  pre_tasks:
    - name: 14 Load and set compute details from JSON file as a fact
      ansible.builtin.set_fact:
        compute_details: "{{ (lookup('file', '/tmp/compute_details.json') | from_json) }}"

  tasks:
    - name: 14 Format compute-0 VM name for libvirt
      ansible.builtin.set_fact:
        compute_zero_vm_name: cifmw-{{ compute_details | selectattr('readable_hostname', 'equalto', 'compute-0') | map(attribute='hostname') | map('regex_replace',
          '\.ctlplane\.example\.com$', '') | first }}

    - name: 14 Restart the compute-0 VM on libvirt
      community.libvirt.virt:
        name: "{{ compute_zero_vm_name }}"
        state: running

- name: 14 Cleanup
  hosts: controller-0
  remote_user: zuul
  gather_facts: false

  vars:
    name: "14-test-threshold"

  pre_tasks:
    - name: 14 Load and set compute details from JSON file as a fact
      ansible.builtin.set_fact:
        compute_details: "{{ (lookup('file', '/tmp/compute_details.json') | from_json) }}"

    - name: 14 Set compute_zero_hostname fact for compute-0
      ansible.builtin.set_fact:
        compute_zero_hostname: "{{ compute_details | selectattr('readable_hostname', 'equalto', 'compute-0') | map(attribute='hostname') | first }}"

  tasks:
    - name: 14 Remove test VM
      openstack.cloud.server:
        cloud: default
        auth:
          project_name: admin
        state: absent
        name: c1-threshold

    - name: 14 Wait compute-0 to be up
      openstack.cloud.compute_service_info:
        cloud: default
        binary: nova-compute
        host: "{{ compute_zero_hostname }}"
      register: compute_0_status
      until: "'up' in compute_0_status.compute_services | map(attribute='state')"
      retries: 24
      delay: 5

    - name: 14 Wait compute-0 to be enabled
      openstack.cloud.compute_service_info:
        cloud: default
        binary: nova-compute
        host: "{{ compute_zero_hostname }}"
      register: compute_0_status
      until: "'enabled' in compute_0_status.compute_services | map(attribute='status')"
      retries: 60
      delay: 5

    - name: 14 save logs
      ansible.builtin.shell: oc logs deploy/instanceha-0 >> /home/zuul/iha-tests-results/{{ name }}.log
      changed_when: false

    - name: 14 Reset iha configmap
      ansible.builtin.template:
        src: templates/iha-cm.yaml.j2
        dest: /home/zuul/iha-cm.yaml

    - name: 14 Apply default config
      ansible.builtin.shell: |
        oc -n openstack apply -f /home/zuul/iha-cm.yaml
      changed_when: false

    - name: 14 Wait for instanceha deployment to be available
      ansible.builtin.shell: |
        oc wait deployment/instanceha-0 -n openstack --for condition=Available --timeout=300s
      changed_when: false

    - name: 14 Create results file (success)
      ansible.builtin.template:
        src: templates/iha-tests-results.xml.j2
        dest: /home/zuul/iha-tests-results/{{ name }}.xml
      vars:
        success: true
